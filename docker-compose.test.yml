version: "3.8"

services:
  # Isolated PostgreSQL Database for Testing
  postgres-test:
    image: postgres:16-alpine
    container_name: fastify_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastify_db_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastify_db_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  # Test Runner Service
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: fastify_test_runner
    environment:
      NODE_ENV: test
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: debug
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fastify_db_test
      DB_SYNC: "true"
      DB_LOG: "false"
      JWT_SECRET: test-jwt-secret-key-12345
      DEFAULT_OTP: "123456"
    depends_on:
      postgres-test:
        condition: service_healthy
